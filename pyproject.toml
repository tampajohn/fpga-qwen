[project]
name = "fpga-qwen-experiment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tokenizers>=0.22,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
reference = [
    "numpy>=2,<3",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "safetensors>=0.5,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "numpy>=2,<3",
    "playwright>=1.65.0",
]
